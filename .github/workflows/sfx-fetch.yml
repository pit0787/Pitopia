name: SFX holen
on:
  push:
    branches: [claude/tts-test]
    paths: [sfx/fetch.py, sfx/chords.py, .github/workflows/sfx-fetch.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 sfx/chords.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sfx
          git commit -m "Applaus-Kandidaten geholt [skip ci]" || true
          git push
